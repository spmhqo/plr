<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buy Now Button Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      color: #1f2937;
      padding: 24px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #111827;
      margin-bottom: 6px;
    }

    header p {
      font-size: 14px;
      color: #6b7280;
    }

    .app-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 820px) {
      .app-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 18px;
      color: #374151;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="url"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus, select:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    .preview-box {
      background: #ffffff;
      border: 2px dashed #e5e7eb;
      border-radius: 10px;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      margin-bottom: 20px;
    }

    .code-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 180px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      padding: 12px;
      border-radius: 6px;
      background-color: #1e293b;
      color: #f1f5f9;
      border: none;
      resize: vertical;
      line-height: 1.45;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn-copy {
      background: #2563eb;
      color: white;
    }

    .btn-copy:hover {
      background: #1d4ed8;
    }

    .btn-copy.copied {
      background: #10b981;
    }

    /* ======================================================== */
    /* EXACT REPLICA BUTTON STYLES (Used in Preview & Generator) */
    /* ======================================================== */
    .gp-wrapper {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      text-decoration: none;
      max-width: 440px;
      width: 100%;
      user-select: none;
    }

    .gp-price-row {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0 4px 6px 4px;
      box-sizing: border-box;
    }

    .gp-regular-price {
      font-size: 19px;
      color: #222222;
      text-decoration: line-through;
      text-decoration-thickness: 1.5px;
      font-family: "Segoe UI", Arial, sans-serif;
      font-weight: 400;
    }

    .gp-today-price {
      font-size: 21px;
      font-weight: 800;
      color: #cc0000;
      font-family: Arial, sans-serif;
    }

    .gp-btn {
      width: 100%;
      height: 74px;
      background: #ffeb00;
      border-radius: 9px;
      display: flex;
      align-items: center;
      text-decoration: none;
      box-shadow: 0 4px 0 #e6c800;
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
      cursor: pointer;
      overflow: hidden;
      box-sizing: border-box;
    }

    .gp-btn:hover {
      filter: brightness(1.02);
    }

    .gp-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #cca500;
    }

    .gp-icon-side {
      width: 82px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1.5px solid #ebd300;
      flex-shrink: 0;
    }

    .gp-icon-side svg {
      width: 46px;
      height: 46px;
      fill: #000000;
    }

    .gp-text-side {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #000000;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-family: "Arial Black", Arial, sans-serif;
      padding-right: 15px;
    }

    .gp-subtext {
      margin-top: 9px;
      font-size: 14px;
      font-style: italic;
      color: #636d77;
      text-align: center;
      letter-spacing: 0.3px;
    }

    .gp-cards {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .gp-card {
      background: #474d53;
      color: #ffffff;
      border-radius: 4px;
      width: 44px;
      height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.15);
    }

    .gp-card svg {
      height: 14px;
      width: auto;
      max-width: 36px;
      fill: #ffffff;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Add to Cart Button Generator</h1>
      <p>Configure your prices, enter target URL, and copy the embed code.</p>
    </header>

    <div class="app-grid">
      <!-- CONFIGURATION INPUTS -->
      <div class="card">
        <h2 class="card-title">1. Button Settings</h2>

        <div class="form-group">
          <label for="targetUrl">Target / Checkout URL:</label>
          <input type="url" id="targetUrl" value="https://example.com/checkout" placeholder="https://yourlink.com" />
        </div>

        <div class="form-group">
          <label for="regularPrice">Regular Price (Crossed Out):</label>
          <input type="text" id="regularPrice" value="$29.95" placeholder="e.g. $29.95" />
        </div>

        <div class="form-group">
          <label for="todayPrice">Today's Price (Discounted):</label>
          <input type="text" id="todayPrice" value="$4.95" placeholder="e.g. $4.95" />
        </div>

        <div class="form-group">
          <label for="buttonText">Button Text:</label>
          <input type="text" id="buttonText" value="ADD TO CART" placeholder="ADD TO CART" />
        </div>

        <div class="form-group">
          <label for="urlTarget">Open Link In:</label>
          <select id="urlTarget">
            <option value="_blank">New Tab / Window (_blank)</option>
            <option value="_self">Same Tab (_self)</option>
          </select>
        </div>
      </div>

      <!-- PREVIEW & EMBED CODE -->
      <div class="card">
        <h2 class="card-title">2. Live Preview</h2>
        
        <div class="preview-box" id="previewArea">
          <!-- Button renders here -->
        </div>

        <div class="code-box-header">
          <label style="margin:0;">3. HTML Embed Code (Copy &amp; Paste)</label>
          <button class="btn btn-copy" id="copyBtn" onclick="copyCode()">Copy Code</button>
        </div>
        <textarea id="outputCode" readonly spellcheck="false"></textarea>
      </div>
    </div>
  </div>

  <script>
    // Cart SVG Icon
    const CART_SVG = `<svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>`;

    // Payment Cards SVGs
    const VISA_SVG = `<svg viewBox="0 0 40 14" style="height:11px"><text x="1" y="12" fill="#fff" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="14" font-style="italic" letter-spacing="1">VISA</text></svg>`;
    const MC_SVG = `<svg viewBox="0 0 34 20" style="height:14px"><circle cx="12" cy="10" r="8" fill="#ffffff" fill-opacity="0.8"/><circle cx="22" cy="10" r="8" fill="#ffffff" fill-opacity="0.8"/><path d="M17 4.8a8 8 0 0 1 0 10.4 8 8 0 0 1 0-10.4z" fill="#ffffff"/></svg>`;
    const AMEX_SVG = `<svg viewBox="0 0 38 16" style="height:11px"><text x="0" y="7" fill="#fff" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5">AMERICAN</text><text x="3" y="14" fill="#fff" font-family="Arial, sans-serif" font-weight="bold" font-size="6.5">EXPRESS</text></svg>`;
    const DISC_SVG = `<svg viewBox="0 0 42 12" style="height:10px"><text x="0" y="10" fill="#fff" font-family="Arial, sans-serif" font-weight="bold" font-size="8.5" letter-spacing="0.5">DISCOVER</text></svg>`;
    const PP_SVG = `<svg viewBox="0 0 38 14" style="height:11px"><text x="1" y="11" fill="#fff" font-family="Arial, sans-serif" font-weight="bold" font-size="11" font-style="italic">PayPal</text></svg>`;

    function generateButtonHTML(regPrice, todayPrice, url, text, target) {
      return `<!-- Start Graphy Buy Now Button -->
<div class="gp-wrapper" style="display:inline-flex;flex-direction:column;align-items:center;font-family:Arial,Helvetica,sans-serif;text-decoration:none;max-width:440px;width:100%;box-sizing:border-box;">
  
  <div style="width:100%;display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px 4px;box-sizing:border-box;">
    <span style="font-size:19px;color:#222;text-decoration:line-through;text-decoration-thickness:1.5px;font-family:'Segoe UI',Arial,sans-serif;">Regular Price: ${regPrice}</span>
    <span style="font-size:21px;font-weight:800;color:#cc0000;font-family:Arial,sans-serif;">Today: ${todayPrice}</span>
  </div>

  <a href="${url}" target="${target}" rel="noopener noreferrer" style="width:100%;height:74px;background:#ffeb00;border-radius:9px;display:flex;align-items:center;text-decoration:none;box-shadow:0 4px 0 #e6c800;cursor:pointer;overflow:hidden;box-sizing:border-box;">
    <div style="width:82px;height:100%;display:flex;align-items:center;justify-content:center;border-right:1.5px solid #ebd300;flex-shrink:0;">
      <svg viewBox="0 0 24 24" style="width:46px;height:46px;fill:#000000;"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
    </div>
    <div style="flex-grow:1;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#000000;letter-spacing:1.5px;text-transform:uppercase;font-family:'Arial Black',Arial,sans-serif;padding-right:15px;">
      ${text}
    </div>
  </a>

  <div style="margin-top:9px;font-size:14px;font-style:italic;color:#636d77;text-align:center;letter-spacing:0.3px;">
    powered by Graphy.com
  </div>

  <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;">
    <!-- Visa -->
    <div style="background:#474d53;border-radius:4px;width:44px;height:25px;display:flex;align-items:center;justify-content:center;">
      ${VISA_SVG}
    </div>
    <!-- MasterCard -->
    <div style="background:#474d53;border-radius:4px;width:44px;height:25px;display:flex;align-items:center;justify-content:center;">
      ${MC_SVG}
    </div>
    <!-- Amex -->
    <div style="background:#474d53;border-radius:4px;width:44px;height:25px;display:flex;align-items:center;justify-content:center;">
      ${AMEX_SVG}
    </div>
    <!-- Discover -->
    <div style="background:#474d53;border-radius:4px;width:44px;height:25px;display:flex;align-items:center;justify-content:center;">
      ${DISC_SVG}
    </div>
    <!-- PayPal -->
    <div style="background:#474d53;border-radius:4px;width:44px;height:25px;display:flex;align-items:center;justify-content:center;">
      ${PP_SVG}
    </div>
  </div>

</div>
<!-- End Graphy Buy Now Button -->`;
    }

    function updatePreview() {
      const regPrice = document.getElementById("regularPrice").value || "$29.95";
      const todayPrice = document.getElementById("todayPrice").value || "$4.95";
      const targetUrl = document.getElementById("targetUrl").value || "#";
      const buttonText = document.getElementById("buttonText").value || "ADD TO CART";
      const target = document.getElementById("urlTarget").value;

      const code = generateButtonHTML(regPrice, todayPrice, targetUrl, buttonText, target);

      // Update Preview Box
      document.getElementById("previewArea").innerHTML = code;

      // Update Output Textarea
      document.getElementById("outputCode").value = code;
    }

    function copyCode() {
      const codeArea = document.getElementById("outputCode");
      codeArea.select();
      codeArea.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(codeArea.value).then(() => {
        const copyBtn = document.getElementById("copyBtn");
        copyBtn.textContent = "Copied!";
        copyBtn.classList.add("copied");
        setTimeout(() => {
          copyBtn.textContent = "Copy Code";
          copyBtn.classList.remove("copied");
        }, 2000);
      });
    }

    // Attach Event Listeners
    document.querySelectorAll("input, select").forEach(input => {
      input.addEventListener("input", updatePreview);
    });

    // Initial render
    updatePreview();
  </script>
</body>
</html>
